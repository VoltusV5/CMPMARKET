<!DOCTYPE html>
<html lang="ru">
    <head>
        <!-- Базовый макет -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CMPMARKET</title>
        <!-- поджключение normalize файла, иконок, css, библиотеки JS jquery -->
        <link 
            rel="stylesheet"
            type="text/css"
            href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

        <link rel="icon" href="{{ url_for('static', filename='img/ico/favicon.ico') }}" type="image/x-icon">
        <link rel="icon" href="{{ url_for('static', filename='img/ico/favicon.png') }}" type="image/png">

        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/global.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/buttons.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/fonts.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/header.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/aside.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/main.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/footer.css') }}">
        
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        
    </head>
    <body>
        <div class="site">
            <!-- Шапка сайта -->
            <header class="header">
                <div class="header__container">
                    <div class="header__top">
                        <div class="header__logo">
                            CMPMARKET
                        </div>
                        <div class="header__search__container">
                            <input class="header__search" type="search" placeholder="Найти на CMPMARKET">
                            <div class="header__search__marketplaces">
                                <a>Ozon</a>
                                <a>Яндекс Маркет</a>
                                <a>AliExpress</a>
                                <a>Wildberries</a>
                            </div>
                        </div>
                        <div class="header__navbar">
                            <div class="header__navbar__info">
                                <a href="#"><img src="static/img/nav/info.png" alr="Информация"></a>
                                <p>Инфо</p>
                            </div>
                            <div class="header__navbar__theme">
                                <a href="#"><img src="static/img/nav/night-mode_white.png" alr="Тема"></a>
                                <p>Тема</p>
                            </div>
                            <div class="header__navbar__sign_in">
                                <a href="/sign_in"><img src="static/img/nav/user__sign_in.png" alr="Войти"></a>
                                <p>Войти</p>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            <!-- main сайта -->
            <main class="main">
                <div class="main-page">
                    <!-- Реклама -->
                    <div class="main-page__banner">
                        <a><img src="https://static-basket-01.wbbasket.ru/vol1/crm-bnrs/bners1/2880_cifr_bum.webp" /></a>
                    </div>
                    <!-- Озон -->
                    <div class="main-page__ozon">
                        <div class="main-page__ozon__title">
                            <img src="https://ir.ozone.ru/s3/cms/eb/t8d/wc200/logo-logo-ozon-blue-png.png" alt="ozon">
                        </div>
                        <div id="product-cards-container-ozon" class="main-page__ozon__cards"></div>         <!-- Контейнер для карточек товара -->
                    </div>
                    <!-- Яндекс Маркет -->
                    <div class="main-page__yandex-market">
                        <div class="main-page__yandex-market__title">
                            <img src="https://edanada.ru/wp-content/uploads/2023/05/ЯндексМаркет.418cc9d.png" 
                                 alt="Яндекс Маркет">
                        </div>
                        <div id="product-cards-container-yandex-market" class="main-page__yandex-market__cards"></div>         <!-- Контейнер для карточек товара -->
                    </div>
                    <!-- AliExpress -->
                    <div class="main-page__AliExpress">
                        <div class="main-page__AliExpress__title">
                            <img src="https://www.mealty.ru/img/partners/aliexpress.png" 
                                 alt="AliExpress">
                        </div>
                        <div id="product-cards-container-AliExpress" class="main-page__AliExpress__cards"></div>         <!-- Контейнер для карточек товара -->
                    </div>
                    <!-- WildBerries -->
                    <div class="main-page__WildBerries">
                        <div class="main-page__WildBerries__title">
                            <img src="https://trebon.ru/wp-content/uploads/2023/06/7587_wildberrieslogo_388012-e1687698484868.png" 
                                 alt="WildBerries">
                        </div>
                        <div id="product-cards-container-WildBerries" class="main-page__WildBerries__cards"></div>         <!-- Контейнер для карточек товара -->
                    </div>
                </div>
            </main>

            <footer>
                footer
            </footer>

        </div>
    </body>
    <script src="{{ url_for('static', filename='scripts/scripts.js') }}"></script>
</html>
